<!DOCTYPE html>
<html>
    <head>
        <title>Price tag</title>
      <style>
        
        .plan_price{
            margin: 50px;
            margin-top: 200px;
            background: rgb(236, 192, 255);
            padding: 100px;
            width: 200px;
            border-radius: 30px;
            font-family: 'Times New Roman', Times, serif; 
        }
        h3{
            text-align: center;
            font-size: xx-large;
        }
        .plan_access{
            font-size: large;
        }
        p{
            text-align: center;
        }
        .plan_button{
         background-color: #8b37de;
         color: black;
         border: none;
         padding: 0px;
         border-radius: 6px;
         cursor: pointer;
         transition: background-color 0.2s ease; 
         text-align: center; 
         margin: 25px auto;
         margin-top: 0px;
         margin-bottom: 0px;
         height: 50px;
         width: 200px;
        }
      </style>
    </head>
    <body>
        <div class="plan_price">
            <header>
                <div>
                    <h1>BASIC PLAN</h1>
                    <h3><b>155.99 $</b></h3>
                </div>
                <main>
                    <div class="plan_access">

                        <p><b>Access</b></p>
                        <ul>
                            <li>50% Daily Ads</li>
                            <li>20 munites playtime</li>
                            <li>Free 1 hour play</li>
                        </ul>
                        <p><b>Upgrade to premium </b></p>
                        <button class="plan_button">GET START</button>
                    </div>
                </main>
            </header>
        </div>
    </body>
</html>
